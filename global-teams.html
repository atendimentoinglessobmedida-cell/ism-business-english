<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062B3B"><title>ISM Premium — Global Teams</title><style>:root{--n:#062B3B;--d:#031D29;--t:#22D5D5;--s:#DDF8F7;--b:#F4F7F8;--x:#102A35;--m:#60747C;--bd:#DDE7EA;--ok:#2BAE83;--gold:#E9A83A}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--x);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:36px}.top{background:linear-gradient(135deg,var(--d),var(--n));color:#fff;padding:15px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:4}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--t);color:var(--d);display:grid;place-items:center;font-weight:900}.brand small{display:block;opacity:.8}.main{padding:15px}.card,.hero{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#fff,#f0fbfb)}h2,h3,p{margin-top:0}.ey{font-size:10px;font-weight:900;letter-spacing:.1em;color:#527b83;text-transform:uppercase}.muted{color:var(--m);line-height:1.5}.badge{display:inline-block;background:#fff1c9;color:#795400;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.btn,.choice,.lesson{border:0;border-radius:13px;min-height:48px;padding:12px 15px;font-weight:800;cursor:pointer}.btn{background:var(--n);color:#fff}.btn.soft{background:var(--s);color:var(--n)}.wide{width:100%}.lesson{display:flex;width:100%;gap:11px;align-items:center;text-align:left;background:#fff;border:1px solid var(--bd);margin:7px 0}.lesson.done{border-color:var(--ok);background:#f2fbf7}.num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--s);display:grid;place-items:center}.lesson.done .num{background:var(--ok);color:#fff}.bar{height:8px;background:#e8eff1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.phrase{padding:12px 0;border-top:1px solid var(--bd)}.en{font-weight:800}.pt{font-size:12px;color:var(--m);margin:4px 0}.audio{border:0;background:var(--s);border-radius:9px;padding:8px 10px;margin:4px 3px 0 0;font-weight:800}.choice{width:100%;text-align:left;background:#fff;color:var(--x);border:1px solid var(--bd);margin:5px 0}.choice.ok{border-color:var(--ok);background:#effbf7}.choice.bad{border-color:#c45b5b;background:#fff3f3}textarea,input{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:115px}.sticky{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:20}.turn{border-left:4px solid var(--t);padding-left:12px}.progress{font-weight:900;color:var(--n)}.builder{display:grid;gap:10px}.preview{white-space:pre-wrap;background:#f7fafb;border:1px solid var(--bd);border-radius:14px;padding:13px}:focus-visible{outline:3px solid #ad7000;outline-offset:3px}</style><link rel="stylesheet" href="brand-theme.css?v=1"><link rel="stylesheet" href="audio-player.css?v=1"><link rel="stylesheet" href="layout.css?v=4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="shared-learning-ui.css?v=1"></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">ISM</div><div><b>Premium Global Teams</b><small>Global Career Pack</small></div></div></header><main class="main"><div class="sticky"><button class="btn soft" onclick="location.href='index.html#premium'">← PREMIUM</button><button class="btn soft" onclick="dashboard()">⌂ TRILHA</button></div><section id="view"><div class="card">Carregando…</div></section></main></div><div id="toast" class="toast" role="status"></div><script src="storage-guard.js?v=2"></script><script src="audio-player.js?v=1"></script><script>const BASE='https://bfuoykappwybuxdlrbmo.supabase.co/functions/v1/',API=BASE+'ism-premium-content?module=P4',SIMAPI=BASE+'ism-premium-simulations?module=P4',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let course=null,sim=null,active=null,st=ISMStorage.read('ismbe:premium:p4:v1');st={...st,done:ISMStorage.object(st.done),practice:ISMStorage.object(st.practice),drafts:ISMStorage.object(st.drafts),builder:ISMStorage.object(st.builder),sim:ISMStorage.object(st.sim)};function save(){ISMStorage.write('ismbe:premium:p4:v1',st)}function speak(t,r=.95){window.ISMAudio.speak(t,r)}function total(){return course?.lessons?.length||8}function completed(){return Object.values(st.done).filter(Boolean).length}function pct(){return Math.round(completed()/total()*100)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2300)}async function init(){try{const [a,b]=await Promise.all([fetch(API),fetch(SIMAPI)]),[j,k]=await Promise.all([a.json(),b.json()]);if(!a.ok||!j.ok||!j.data)throw Error();course=j.data;sim=Array.isArray(k?.data)?k.data[0]:(k?.data||null);try{localStorage.setItem('ismbe:premium:p4:course-cache:v1',JSON.stringify(course));if(sim)localStorage.setItem('ismbe:premium:p4:sim-cache:v1',JSON.stringify(sim))}catch(_){}dashboard()}catch(e){try{course=JSON.parse(localStorage.getItem('ismbe:premium:p4:course-cache:v1')||'null');sim=JSON.parse(localStorage.getItem('ismbe:premium:p4:sim-cache:v1')||'null')}catch(_){course=null;sim=null}if(course){dashboard();toast('Modo offline: conteúdo salvo neste aparelho.')}else{$('view').innerHTML='<div class="card"><h3>Não foi possível carregar esta trilha.</h3><p class="muted">Conecte-se à internet uma vez para salvar o conteúdo do P4 neste aparelho. Seu progresso permanece preservado.</p><button class="btn" onclick="init()">TENTAR NOVAMENTE</button></div>'}}}function dashboard(){if(!course)return init();const p=pct();$('view').innerHTML='<div class="hero"><span class="badge">👑 PREMIUM BONUS 04</span><h2 style="margin-top:10px">'+esc(course.title)+'</h2><p class="muted">'+esc(course.goal)+'</p><div class="bar"><i style="width:'+p+'%"></i></div><p><b>'+completed()+'/'+total()+' lições • '+p+'%</b></p></div>'+(p===100?'<div class="card"><h3>🏆 '+esc(course.achievement)+'</h3><p class="muted">Você concluiu a trilha de colaboração em equipes globais.</p></div>':'')+'<div class="card"><div class="ey">LIÇÕES</div>'+course.lessons.map((l,i)=>'<button class="lesson '+(st.done[l.id]?'done':'')+'" onclick="openLesson('+i+')"><span class="num">'+(st.done[l.id]?'✓':i+1)+'</span><span><b>'+esc(l.title)+'</b><small class="muted">'+esc(l.pt)+' • '+l.minutes+' min</small></span></button>').join('')+'</div><div class="card"><div class="ey">GLOBAL TEAM TOOL</div><h3>Async Status Update Builder</h3><p class="muted">Estruture atualizações claras para equipes distribuídas: progresso, blocker, owner, prazo e próximo passo.</p><button class="btn wide" onclick="builder()">CRIAR STATUS UPDATE</button></div><div class="card"><div class="ey">GUIDED SIMULATION</div><h3>Cross-Time-Zone Project</h3><p class="muted">Repare um mal-entendido de prazo sem culpar a outra equipe e feche um novo acordo objetivo.</p><button class="btn wide" onclick="simulation()">INICIAR SIMULAÇÃO</button></div>';window.scrollTo(0,0)}function openLesson(i){const l=course.lessons[i];active={i,id:l.id};$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">LESSON '+esc(l.id)+'</div><h2>'+esc(l.title)+'</h2><p class="muted">'+esc(l.objective)+'</p></div><div class="card"><div class="ey">CONTEXT</div><h3>'+esc(l.context)+'</h3></div><div class="card"><div class="ey">LEARN + LISTEN</div>'+l.learn.map(x=>'<div class="phrase"><div class="en">'+esc(x[0])+'</div><div class="pt">'+esc(x[1])+'</div><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+')">▶ Normal</button><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+',.72)">🐢 Slow</button></div>').join('')+'</div><div class="card"><div class="ey">NOTICE</div><p>'+esc(Array.isArray(l.notice)?l.notice.join(' '):l.notice)+'</p></div><div class="card"><div class="ey">PRACTICE</div><h3>'+esc(l.practice.prompt)+'</h3>'+l.practice.options.map((o,j)=>'<button class="choice" onclick="grade(this,'+(j===l.practice.answer)+')">'+esc(o)+'</button>').join('')+'<p id="pf" class="muted">'+(st.practice[l.id]?'✓ Atividade concluída.':'Escolha a melhor resposta.')+'</p></div><div class="card"><div class="ey">APPLY • GLOBAL TEAM</div><h3>'+esc(l.speak)+'</h3><p class="muted">Adapte à sua realidade profissional. Escreva o que você diria ou enviaria à equipe.</p><textarea id="draft" oninput="saveDraft()" placeholder="Escreva em inglês…">'+esc(st.drafts[l.id]||'')+'</textarea><button class="btn soft" onclick="listenDraft()">▶ OUVIR</button><button class="btn wide" onclick="finishLesson()">CONCLUIR LIÇÃO</button></div>';window.scrollTo(0,0)}function grade(el,ok){const box=el.closest('.card'),choices=[...box.querySelectorAll('.choice')];el.classList.add(ok?'ok':'bad');if(ok){choices.forEach(b=>b.disabled=true);st.practice[active.id]=true;save();$('pf').textContent='✓ Correto. '+(course.lessons[active.i].practice.feedback||'')}else{el.disabled=true;$('pf').textContent='Revise e escolha outra alternativa. '+(course.lessons[active.i].practice.feedback||'')}}function saveDraft(){st.drafts[active.id]=$('draft').value;save()}function listenDraft(){const t=String($('draft').value||'').trim();if(!t)return toast('Escreva sua resposta primeiro.');speak(t)}function finishLesson(){saveDraft();if(!st.practice[active.id])return toast('Conclua corretamente o Practice.');if(String(st.drafts[active.id]||'').trim().length<18)return toast('Aplique a linguagem em uma resposta um pouco mais completa.');st.done[active.id]=true;save();const n=active.i+1;n<course.lessons.length?openLesson(n):dashboard()}function builder(){const b=st.builder;$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">ASYNC STATUS UPDATE BUILDER</div><h2>Global Team Update</h2><div class="builder"><label><b>Progress</b><textarea id="b1">'+esc(b.progress||'We are currently…')+'</textarea></label><label><b>Main blocker / risk</b><textarea id="b2">'+esc(b.blocker||'The main blocker is…')+'</textarea></label><label><b>Ownership</b><input id="b3" value="'+esc(b.owner||'I’ll take ownership of…')+'"></label><label><b>Exact deadline / time zone</b><input id="b4" value="'+esc(b.deadline||'by 2 p.m. UTC on Friday')+'"></label><label><b>Next step</b><textarea id="b5">'+esc(b.next||'The next step is…')+'</textarea></label></div><button class="btn wide" onclick="buildUpdate()">GERAR UPDATE</button><div id="preview"></div></div>'}function buildUpdate(){st.builder={progress:$('b1').value,blocker:$('b2').value,owner:$('b3').value,deadline:$('b4').value,next:$('b5').value};save();const t=[st.builder.progress,st.builder.blocker,st.builder.owner+(st.builder.deadline?' '+st.builder.deadline+'.':''),st.builder.next].filter(Boolean).join('\n\n');$('preview').innerHTML='<div class="preview">'+esc(t)+'</div><button class="btn soft" onclick="speak('+esc(JSON.stringify(t))+')">▶ OUVIR</button>'}function simQuestions(){return sim?[sim.opening,...(sim.turns||[]).map(x=>x.prompt)]:[]}function simulation(){if(!sim)return toast('Simulação indisponível no momento.');const qs=simQuestions(),a=Array.isArray(st.sim.answers)?st.sim.answers:[],step=st.sim.completed?qs.length-1:Math.min(a.filter(x=>String(x||'').trim()).length,qs.length-1);$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">GUIDED SIMULATION</div><h2>'+esc(sim.title)+'</h2><p><b>Role:</b> '+esc(sim.role)+'</p><p><b>Goal:</b> '+esc(sim.goal)+'</p><p class="muted">Feedback formativo. O objetivo é reparar o entendimento, ser específico sobre prazo/fuso e assumir ownership. Não há nota automática de pronúncia.</p></div>'+(st.sim.completed?'<div class="card"><h3>✓ Conversa concluída</h3><p class="muted">Compare sua abordagem com o modelo abaixo. Use-o como referência, não como texto para memorizar.</p><div class="ey">MODEL ANSWER</div><p>'+esc(sim.model)+'</p><button class="btn soft" onclick="speak('+esc(JSON.stringify(sim.model))+')">▶ OUVIR MODELO</button><button class="btn soft" onclick="restartSim()">↻ PRATICAR NOVAMENTE</button></div>':'<div class="card turn"><div class="progress">Etapa '+(step+1)+' de '+qs.length+'</div><h3>'+esc(qs[step])+'</h3><textarea id="sa" placeholder="Responda em inglês…">'+esc(a[step]||'')+'</textarea><button class="btn wide" onclick="saveTurn('+step+')">'+(step===qs.length-1?'CONCLUIR CONVERSA':'RESPONDER E CONTINUAR')+'</button></div>');window.scrollTo(0,0)}function saveTurn(step){const t=String($('sa').value||'').trim();if(t.length<10)return toast('Dê uma resposta um pouco mais completa.');const qs=simQuestions(),a=Array.isArray(st.sim.answers)?st.sim.answers:[];a[step]=t;st.sim.answers=a;if(step>=qs.length-1)st.sim.completed=true;save();simulation()}function restartSim(){st.sim={answers:[],completed:false};save();simulation()}init();</script><script src="pwa-install.js?v=1"></script></body></html>
