<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062B3B"><title>ISM Premium — Networking</title><style>:root{--n:#062B3B;--d:#031D29;--t:#22D5D5;--s:#DDF8F7;--b:#F4F7F8;--x:#102A35;--m:#60747C;--bd:#DDE7EA;--ok:#2BAE83;--gold:#E9A83A}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--x);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:36px}.top{background:linear-gradient(135deg,var(--d),var(--n));color:#fff;padding:15px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:4}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--t);color:var(--d);display:grid;place-items:center;font-weight:900}.brand small{display:block;opacity:.8}.main{padding:15px}.card,.hero{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#fff,#f0fbfb)}h2,h3,p{margin-top:0}.ey{font-size:10px;font-weight:900;letter-spacing:.1em;color:#527b83;text-transform:uppercase}.muted{color:var(--m);line-height:1.5}.badge{display:inline-block;background:#fff1c9;color:#795400;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.btn,.choice,.lesson{border:0;border-radius:13px;min-height:48px;padding:12px 15px;font-weight:800;cursor:pointer}.btn{background:var(--n);color:#fff}.btn.soft{background:var(--s);color:var(--n)}.wide{width:100%}.lesson{display:flex;width:100%;gap:11px;align-items:center;text-align:left;background:#fff;border:1px solid var(--bd);margin:7px 0}.lesson.done{border-color:var(--ok);background:#f2fbf7}.num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--s);display:grid;place-items:center}.lesson.done .num{background:var(--ok);color:#fff}.bar{height:8px;background:#e8eff1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.phrase{padding:12px 0;border-top:1px solid var(--bd)}.en{font-weight:800}.pt{font-size:12px;color:var(--m);margin:4px 0}.audio{border:0;background:var(--s);border-radius:9px;padding:8px 10px;margin:4px 3px 0 0;font-weight:800}.choice{width:100%;text-align:left;background:#fff;color:var(--x);border:1px solid var(--bd);margin:5px 0}.choice.ok{border-color:var(--ok);background:#effbf7}.choice.bad{border-color:#c45b5b;background:#fff3f3}textarea,input{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:120px}.sticky{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:20}.turn{border-left:4px solid var(--t);padding-left:12px}.progress{font-weight:900;color:var(--n)}:focus-visible{outline:3px solid #ad7000;outline-offset:3px}</style><link rel="stylesheet" href="brand-theme.css?v=1"><link rel="stylesheet" href="audio-player.css?v=2"><link rel="stylesheet" href="layout.css?v=4"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="shared-learning-ui.css?v=2"><link rel="stylesheet" href="premium-shell.css?v=1"></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">ISM</div><div><b>Premium Networking</b><small>Global Career Pack</small></div></div></header><main class="main"><div class="sticky"><button class="btn soft" onclick="location.href='index.html#premium'">← PREMIUM</button><button class="btn soft" onclick="dashboard()">⌂ TRILHA</button></div><section id="view"><div class="card">Carregando…</div></section></main></div><div id="toast" class="toast"></div><script src="storage-guard.js?v=2"></script><script src="audio-player.js?v=2"></script><script>const BASE='https://bfuoykappwybuxdlrbmo.supabase.co/functions/v1/',API=BASE+'ism-premium-content?module=P3',SIMAPI=BASE+'ism-premium-simulations?module=P3',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let course=null,sim=null,active=null,st=ISMStorage.read('ismbe:premium:p3:v1');st={...st,done:ISMStorage.object(st.done),practice:ISMStorage.object(st.practice),speaking:ISMStorage.object(st.speaking),drafts:ISMStorage.object(st.drafts),intro:ISMStorage.object(st.intro),sim:ISMStorage.object(st.sim)};function save(){ISMStorage.write('ismbe:premium:p3:v1',st)}function speak(t,r=.95){window.ISMAudio.speak(t,r)}function total(){return course?.lessons?.length||7}function completed(){return Object.values(st.done).filter(Boolean).length}function pct(){return Math.round(completed()/total()*100)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}async function init(){try{const [a,b]=await Promise.all([fetch(API),fetch(SIMAPI)]),[j,k]=await Promise.all([a.json(),b.json()]);if(!a.ok||!j.ok||!j.data)throw Error();course=j.data;sim=Array.isArray(k?.data)?k.data[0]:(k?.data||null);dashboard()}catch(e){$('view').innerHTML='<div class="card"><h3>Não foi possível carregar a trilha.</h3><p class="muted">Seu progresso salvo permanece no aparelho.</p><button class="btn" onclick="init()">TENTAR NOVAMENTE</button></div>'}}function dashboard(){if(!course)return init();const p=pct();$('view').innerHTML='<div class="hero"><span class="badge">👑 PREMIUM BONUS 03</span><h2 style="margin-top:10px">'+esc(course.title)+'</h2><p class="muted">'+esc(course.goal)+'</p><div class="bar"><i style="width:'+p+'%"></i></div><p><b>'+completed()+'/'+total()+' lições • '+p+'%</b></p></div>'+(p===100?'<div class="card"><h3>🏆 '+esc(course.achievement)+'</h3><p class="muted">Você concluiu a trilha de networking profissional.</p></div>':'')+'<div class="card"><div class="ey">LIÇÕES</div>'+course.lessons.map((l,i)=>'<button class="lesson '+(st.done[l.id]?'done':'')+'" onclick="openLesson('+i+')"><span class="num">'+(st.done[l.id]?'✓':i+1)+'</span><span><b>'+esc(l.title)+'</b><small class="muted">'+esc(l.pt)+' • '+l.minutes+' min</small></span></button>').join('')+'</div><div class="card"><div class="ey">SPEAKING TOOL</div><h3>20–60 Second Professional Introduction</h3><p class="muted">Construa uma apresentação curta para eventos, reuniões e contatos internacionais.</p><button class="btn wide" onclick="introBuilder()">CRIAR MINHA INTRODUÇÃO</button></div><div class="card"><div class="ey">GUIDED SIMULATION</div><h3>Conference Networking</h3><p class="muted">Conduza uma conversa completa: abrir → apresentar-se → explorar → encerrar e conectar.</p><button class="btn wide" onclick="simulation()">INICIAR SIMULAÇÃO</button></div>';window.scrollTo(0,0)}function openLesson(i){const l=course.lessons[i];active={i,id:l.id};$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">LESSON '+esc(l.id)+'</div><h2>'+esc(l.title)+'</h2><p class="muted">'+esc(l.objective)+'</p></div><div class="card"><div class="ey">CONTEXT</div><h3>'+esc(l.context)+'</h3></div><div class="card"><div class="ey">LEARN + LISTEN</div>'+l.learn.map(x=>'<div class="phrase"><div class="en">'+esc(x[0])+'</div><div class="pt">'+esc(x[1])+'</div><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+')">▶ Normal</button><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+',.72)">🐢 Slow</button></div>').join('')+'</div><div class="card"><div class="ey">NOTICE</div><p>'+esc(Array.isArray(l.notice)?l.notice.join(' '):l.notice)+'</p></div><div class="card"><div class="ey">PRACTICE</div><h3>'+esc(l.practice.prompt)+'</h3>'+l.practice.options.map((o,j)=>'<button class="choice" onclick="grade(this,'+(j===l.practice.answer)+')">'+esc(o)+'</button>').join('')+'<p id="pf" class="muted">'+(st.practice[l.id]?'✓ Atividade concluída.':'Escolha a melhor resposta.')+'</p></div><div class="card"><div class="ey">SPEAK • TRANSFER TO WORK</div><h3>'+esc(l.speak)+'</h3><textarea id="draft" oninput="saveDraft()" placeholder="Planeje em inglês o que você quer dizer…">'+esc(st.drafts[l.id]||'')+'</textarea><button class="btn soft" onclick="listenDraft()">▶ OUVIR MEU TEXTO</button><button class="btn soft" onclick="markSpeak()">🎙 FIZ A PRÁTICA ORAL</button><p id="sp" class="muted">'+(st.speaking[l.id]?'✓ Prática oral registrada.':'Fale em voz alta; o app não atribui nota de pronúncia.')+'</p><button class="btn wide" onclick="finishLesson()">CONCLUIR LIÇÃO</button></div>';window.scrollTo(0,0)}function grade(el,ok){const box=el.closest('.card'),choices=[...box.querySelectorAll('.choice')];el.classList.add(ok?'ok':'bad');if(ok){choices.forEach(b=>b.disabled=true);st.practice[active.id]=true;save();$('pf').textContent='✓ Correto. '+(course.lessons[active.i].practice.feedback||'')}else{el.disabled=true;$('pf').textContent='Revise e escolha outra alternativa. '+(course.lessons[active.i].practice.feedback||'')}}function saveDraft(){st.drafts[active.id]=$('draft').value;save()}function listenDraft(){const t=String($('draft').value||'').trim();if(!t)return toast('Escreva primeiro o que você pretende dizer.');speak(t)}function markSpeak(){st.speaking[active.id]=true;save();$('sp').textContent='✓ Prática oral registrada.'}function finishLesson(){saveDraft();if(!st.practice[active.id])return toast('Conclua corretamente o Practice.');if(!st.speaking[active.id])return toast('Faça a prática oral antes de concluir.');if(String(st.drafts[active.id]||'').trim().length<15)return toast('Planeje uma resposta um pouco mais completa.');st.done[active.id]=true;save();const n=active.i+1;n<course.lessons.length?openLesson(n):dashboard()}function introBuilder(){const b=st.intro;$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">PROFESSIONAL INTRODUCTION BUILDER</div><h2>Minha apresentação</h2><p class="muted">Não recite seu currículo. Conecte função, foco atual, valor e uma ponte para continuar a conversa.</p><label><b>Role / area</b><input id="i1" value="'+esc(b.role||'I work in…')+'"></label><label><b>Main focus</b><textarea id="i2">'+esc(b.focus||'I mainly focus on…')+'</textarea></label><label><b>Current project / value</b><textarea id="i3">'+esc(b.current||'At the moment, I’m working on…')+'</textarea></label><label><b>Conversation bridge</b><input id="i4" value="'+esc(b.bridge||'What about you?')+'"></label><button class="btn wide" onclick="buildIntro()">GERAR INTRODUÇÃO</button><div id="preview"></div></div>'}function buildIntro(){st.intro={role:$('i1').value,focus:$('i2').value,current:$('i3').value,bridge:$('i4').value};save();const t=[st.intro.role,st.intro.focus,st.intro.current,st.intro.bridge].filter(Boolean).join(' ');$('preview').innerHTML='<div class="card"><p>'+esc(t)+'</p><button class="btn soft" onclick="speak('+esc(JSON.stringify(t))+')">▶ OUVIR</button><button class="btn soft" onclick="speak('+esc(JSON.stringify(t))+',.72)">🐢 SLOW</button></div>'}function simQuestions(){if(!sim)return[];return [sim.opening,...(sim.turns||[]).map(x=>x.prompt)]}function simulation(){if(!sim)return toast('Simulação indisponível no momento.');const qs=simQuestions(),answers=Array.isArray(st.sim.answers)?st.sim.answers:[];const step=Math.min(answers.length,qs.length-1);$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">GUIDED SIMULATION</div><h2>'+esc(sim.title)+'</h2><p><b>Role:</b> '+esc(sim.role)+'</p><p><b>Goal:</b> '+esc(sim.goal)+'</p><p class="muted">Feedback formativo: clareza, tarefa e linguagem profissional. Não há nota precisa de pronúncia nem decisão de contratação.</p></div><div class="card turn"><div class="progress">Etapa '+(step+1)+' de '+qs.length+'</div><h3>'+esc(qs[step])+'</h3><textarea id="sa" placeholder="Responda em inglês…">'+esc(answers[step]||'')+'</textarea><button class="btn wide" onclick="saveTurn('+step+')">'+(step===qs.length-1?'CONCLUIR CONVERSA':'RESPONDER E CONTINUAR')+'</button></div>'+(st.sim.completed?'<div class="card"><div class="ey">MODEL ANSWER — APÓS A PRÁTICA</div><p>'+esc(sim.model)+'</p><button class="btn soft" onclick="speak('+esc(JSON.stringify(sim.model))+')">▶ OUVIR MODELO</button></div>':'');window.scrollTo(0,0)}function saveTurn(step){const t=String($('sa').value||'').trim();if(t.length<8)return toast('Dê uma resposta um pouco mais completa.');const qs=simQuestions(),a=Array.isArray(st.sim.answers)?st.sim.answers:[];a[step]=t;st.sim.answers=a;if(step>=qs.length-1){st.sim.completed=true;save();simulation();toast('Simulação concluída. Revise o modelo como referência, não como resposta para memorizar.')}else{save();simulation()}}init();</script><script src="pwa-install.js?v=1"></script><script src="learning-quality.js?v=1"></script><script src="premium-shell.js?v=1"></script></body></html>
