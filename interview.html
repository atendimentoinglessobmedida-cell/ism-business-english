<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00162c"><title>ISM Premium — Job Interviews</title><style>:root{--n:#062B3B;--d:#031D29;--t:#22D5D5;--s:#DDF8F7;--b:#F4F7F8;--x:#102A35;--m:#60747C;--bd:#DDE7EA;--ok:#2BAE83;--gold:#E9A83A}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--x);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:36px}.top{background:linear-gradient(135deg,var(--d),var(--n));color:#fff;padding:15px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--t);color:var(--d);display:grid;place-items:center;font-weight:900}.brand small{display:block;opacity:.8}.main{padding:15px}.card,.hero{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#fff,#fff8e7)}h2,h3,h4,p{margin-top:0}.ey{font-size:10px;font-weight:900;letter-spacing:.1em;color:#527b83;text-transform:uppercase}.muted{color:var(--m);line-height:1.5}.badge{display:inline-block;background:#fff1c9;color:#795400;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.btn,.choice{border:0;border-radius:13px;min-height:48px;padding:12px 15px;font-weight:850;background:var(--n);color:#fff;cursor:pointer}.btn.soft{background:var(--s);color:var(--n)}.btn.gold{background:#ffd36a;color:#102a35}.wide{width:100%}.bar{height:8px;background:#e8eff1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.step{border-left:4px solid var(--t)}.step.done{border-left-color:var(--ok);background:#f3fbf7}.stepHead{display:flex;gap:10px;align-items:flex-start}.num{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--s);display:grid;place-items:center;font-weight:900}.step.done .num{background:var(--ok);color:#fff}.fields{display:grid;gap:9px}label b{display:block;margin-bottom:4px}input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:100px}.pill{display:inline-block;background:var(--s);border-radius:99px;padding:6px 9px;margin:2px;font-size:10px;font-weight:800}.moduleBtn{width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:14px;padding:13px;margin:7px 0}.lessonBtn{width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:13px;padding:12px;margin:6px 0}.lessonBtn.done{border-color:var(--ok);background:#f1fbf7}.phrase{padding:10px 0;border-top:1px solid var(--bd)}.en{font-weight:800}.pt{font-size:12px;color:var(--m)}.audio{border:0;background:var(--s);border-radius:9px;padding:8px 10px;margin:5px 3px 0 0;font-weight:800}.choice{width:100%;text-align:left;background:#fff;color:var(--x);border:1px solid var(--bd);margin:5px 0}.choice.ok{border-color:var(--ok);background:#effbf7}.choice.bad{border-color:#c45b5b;background:#fff3f3}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tab{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:9px 11px;font-weight:800}.tab.on{background:var(--n);color:#fff}.bubble{background:#eef6f8;border-radius:14px;padding:12px;margin:8px 0}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score div{border:1px solid var(--bd);border-radius:12px;padding:9px;text-align:center}.score b{display:block;font-size:18px}.stickyBack{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}@media(max-width:360px){.score{grid-template-columns:1fr}}.step.in-progress{border-left-color:var(--gold)}.stage-status{display:flex;justify-content:space-between;gap:8px;margin:10px 0;font-size:13px}.step .bar{margin-bottom:12px}.bubble.you{background:var(--s);white-space:pre-wrap;overflow-wrap:anywhere}.btn:disabled{opacity:.5;cursor:not-allowed}.sim-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.sim-actions .btn{flex:1}progress{width:100%;accent-color:var(--gold)}.status-note{font-size:13px;color:var(--m)}:focus-visible{outline:3px solid #ad7000;outline-offset:3px}</style><link rel="stylesheet" href="brand-theme.css?v=1"><link rel="stylesheet" href="audio-player.css?v=1"><link rel="stylesheet" href="experience.css?v=2"><link rel="stylesheet" href="layout.css?v=1"></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">ISM</div><div><b>Premium Job Interviews</b><small>Global Career Pack</small></div></div></header><main class="main"><div class="stickyBack"><button class="btn soft" onclick="location.href='index.html#premium'">← PREMIUM</button><button class="btn gold" onclick="showDashboard()">⌂ LAB</button></div><section id="view"></section><footer class="brand-footer">BUSINESS ENGLISH <span>•</span> MEETINGS &amp; PRESENTATIONS<br><small>MÁRCIO GUARIBA · INGLÊS SOB MEDIDA</small></footer></main></div><script src="audio-player.js?v=1"></script><script>const BASE='https://bfuoykappwybuxdlrbmo.supabase.co/functions/v1/',CONTENT=BASE+'ism-interview-content',PATH=BASE+'ism-interview-pathway',LAB=BASE+'ism-interview-lab',SIMS=BASE+'ism-premium-simulations';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let st={};try{st=JSON.parse(localStorage.getItem('ismbe:premium:p1:v1')||'{}')}catch(e){}st={...st,profile:st.profile||{},stars:st.stars||[],lessons:st.lessons||{},sims:st.sims||{},mock:st.mock||{},action:st.action||{},diag:st.diag||{}};let catalog=[],pathway=null;function save(){localStorage.setItem('ismbe:premium:p1:v1',JSON.stringify(st))}function doneCount(){return Object.values(st.lessons).filter(Boolean).length}function speak(t,r=.95){window.ISMAudio.speak(t,r)}async function j(url){const r=await fetch(url);if(!r.ok)throw Error('network');return r.json()}function moduleDone(m){return Object.keys(st.lessons).filter(k=>k.startsWith(m+'.')&&st.lessons[k]).length>=6}function rangeDone(a,b){for(let m=a;m<=b;m++)if(!moduleDone(m))return false;return true}async function openStage(id){if(id===1)return diagnostic();if(id===2)return profile();if([3,5,6,7].includes(id))return modules(id);if(id===4)return starBank();if(id===8)return simulations();if(id===9)return fullMock();if(id===10)return actionPlan()}async function diagnostic(){const skills=['Professional introduction','Professional value','STAR stories','Difficult questions','Motivation & fit','Salary','Candidate questions','Spoken delivery'];$('view').innerHTML='<div class="card"><div class="ey">ETAPA 1</div><h2>Interview Readiness Check</h2><p class="muted">Avalie sua confiança atual. Isso não é um teste de proficiência.</p>'+skills.map((x,i)=>'<label><b>'+x+'</b><select id="d'+i+'"><option value="">Selecione</option>'+[1,2,3,4,5].map(n=>'<option '+(st.diag[i]==n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><br>').join('')+'<button class="btn wide" onclick="saveDiag()">SALVAR DIAGNÓSTICO</button></div>'}function saveDiag(){for(let i=0;i<8;i++)st.diag[i]=+$('d'+i).value||0;save();showDashboard()}async function profile(){const p=(await j(LAB+'?section=profile')).data;$('view').innerHTML='<div class="card"><div class="ey">ETAPA 2</div><h2>'+p.title+'</h2><p class="muted">'+p.rule+'</p><div class="fields">'+p.fields.map(f=>'<label><b>'+esc(f.label)+'</b><small class="muted">'+esc(f.prompt)+'</small><textarea id="p-'+f.id+'">'+esc(st.profile[f.id]||'')+'</textarea></label>').join('')+'</div><button class="btn wide" onclick="saveProfile()">SALVAR INTERVIEW PROFILE</button></div>'}function saveProfile(){document.querySelectorAll('[id^="p-"]').forEach(e=>st.profile[e.id.slice(2)]=e.value.trim());save();showDashboard()}async function modules(stage){const ids=stage===3?[13,14]:stage===5?[15]:stage===6?[16]:[17];$('view').innerHTML='<div class="card"><h2>'+pathway.stages[stage-1].title+'</h2><div id="moduleList">Carregando…</div></div>';let html='';for(const id of ids){const m=(await j(CONTENT+'?module='+id)).data;html+='<button class="moduleBtn" onclick="openModule('+id+')"><b>'+esc(m.title)+'</b><small class="muted">'+m.lessons.filter(l=>st.lessons[l.id]).length+'/'+m.lessons.length+' concluídas • '+esc(m.achievement)+'</small></button>'}$('moduleList').innerHTML=html}async function openModule(id){const m=(await j(CONTENT+'?module='+id)).data;$('view').innerHTML='<button class="btn soft" onclick="modules('+(id<=14?3:id===15?5:id===16?6:7)+')">← VOLTAR</button><div class="card"><div class="ey">INTERVIEW MODULE '+id+'</div><h2>'+esc(m.title)+'</h2><p class="muted">'+esc(m.goal)+'</p>'+m.lessons.map(l=>'<button class="lessonBtn '+(st.lessons[l.id]?'done':'')+'" onclick="openLesson('+esc(JSON.stringify(l.id))+')"><b>'+(st.lessons[l.id]?'✓ ':'')+esc(l.title)+'</b><small class="muted">'+esc(l.pt)+' • '+l.minutes+' min</small></button>').join('')+'</div>'}async function openLesson(id){const l=(await j(CONTENT+'?lesson='+encodeURIComponent(id))).data;activeLesson={id,correct:false,feedback:l.practice.feedback};let notice=Array.isArray(l.notice)?l.notice:[];$('view').innerHTML='<button class="btn soft" onclick="openModule('+id.split('.')[0]+')">← MÓDULO</button><div class="card"><div class="ey">LESSON '+esc(id)+'</div><h2>'+esc(l.title)+'</h2><p class="muted">'+esc(l.objective)+'</p></div><div class="card"><div class="ey">CONTEXT</div><h3>'+esc(l.context)+'</h3></div><div class="card"><div class="ey">LEARN + LISTEN</div>'+l.learn.map(x=>'<div class="phrase"><div class="en">'+esc(x[0])+'</div><div class="pt">'+esc(x[1])+'</div><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+')">▶ Normal</button><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+',.72)">🐢 Slow</button></div>').join('')+'</div>'+(notice.length?'<div class="card"><div class="ey">NOTICE</div>'+notice.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>':'')+'<div class="card"><div class="ey">PRACTICE</div><h3>'+esc(l.practice.prompt)+'</h3>'+rotatePremium(l.practice.options,id).map(o=>'<button class="choice" onclick="grade(this,'+(o===l.practice.options[l.practice.answer])+')">'+esc(o)+'</button>').join('')+'<p class="muted" id="practiceFeedback" role="status">Escolha a melhor resposta.</p></div><div class="card"><div class="ey">SPEAK</div><h3>'+esc(l.speak)+'</h3><p class="muted">Responda usando sua experiência real. Evite memorizar o modelo palavra por palavra.</p><label class="speaking-check"><input type="checkbox" id="lessonSpoken"> Pratiquei minha resposta em voz alta.</label><p id="lessonStatus" role="status"></p><button class="btn wide" onclick="finishLesson('+esc(JSON.stringify(id))+')">✓ CONCLUIR LIÇÃO</button></div>'}function rotatePremium(options,id){const offset=String(id).split('').reduce((n,c)=>n+c.charCodeAt(0),0)%options.length;return options.slice(offset).concat(options.slice(0,offset))}let activeLesson=null;function grade(el,ok){el.classList.add(ok?'ok':'bad');if(ok)activeLesson.correct=true;$('practiceFeedback').textContent=(ok?'✓ Correto. ':'Revise e tente novamente. ')+(activeLesson.feedback||'')}function finishLesson(id){if(activeLesson?.id!==id||!activeLesson.correct||!$('lessonSpoken').checked){$('lessonStatus').textContent='Acerte a atividade e registre sua prática oral para concluir.';return;}st.lessons[id]=true;save();openModule(+id.split('.')[0])}async function starBank(){const sb=(await j(LAB+'?section=star')).data;let html='<div class="card"><div class="ey">ETAPA 4</div><h2>'+sb.title+'</h2><p class="muted">Meta: pelo menos 5 histórias reais reutilizáveis.</p><button class="btn wide" onclick="editStar(-1)">+ NOVA STAR STORY</button></div>';html+=st.stars.map((s,i)=>'<div class="card"><span class="pill">'+esc(s.category)+'</span><h3>'+esc(s.title||'STAR Story '+(i+1))+'</h3><p class="muted">'+esc(s.result||'Sem resultado registrado')+'</p><button class="btn soft" onclick="editStar('+i+')">EDITAR</button></div>').join('');$('view').innerHTML=html}async function editStar(i){const sb=(await j(LAB+'?section=star')).data,s=i>=0?st.stars[i]:{};$('view').innerHTML='<div class="card"><h2>STAR Story Builder</h2><label><b>Título</b><input id="st-title" value="'+esc(s.title||'')+'"></label><label><b>Categoria</b><select id="st-cat">'+sb.categories.map(c=>'<option '+(s.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+sb.slots.map(x=>'<label><b>'+x.label+'</b><small class="muted">'+x.guide+'</small><textarea id="st-'+x.id+'">'+esc(s[x.id]||'')+'</textarea></label>').join('')+'<button class="btn wide" onclick="saveStar('+i+')">SALVAR STAR STORY</button></div>'}function saveStar(i){const s={title:$('st-title').value,category:$('st-cat').value};['situation','task','action','result','learning'].forEach(k=>s[k]=$('st-'+k).value.trim());if(i>=0)st.stars[i]=s;else st.stars.push(s);save();starBank()}async function fullMock(){const m=(await j(LAB+'?section=mock')).data;const qs=m.stages.flatMap(s=>s.questions||s.pool?.slice(0,1)||[]);$('view').innerHTML='<div class="hero"><div class="ey">ETAPA 9 • FINAL ASSESSMENT</div><h2>Full Mock Interview</h2><p class="muted">Apoio mínimo. Responda naturalmente e sem ler scripts.</p></div>'+qs.map((q,i)=>'<div class="card"><div class="bubble"><b>Interviewer:</b><br>'+esc(q)+'</div><button class="audio" onclick="speak('+esc(JSON.stringify(q))+')">▶ OUVIR</button><textarea oninput="saveMockDraft()" aria-label="Resposta '+(i+1)+'" id="mq'+i+'" placeholder="Resposta…">'+esc(st.mock[i]||'')+'</textarea></div>').join('')+'<div class="card"><p class="muted">Feedback automatizado nesta versão é formativo e não mede pronúncia, gramática, personalidade ou potencial de contratação com precisão.</p><p id="mockStatus" role="status">Rascunho salvo enquanto você digita.</p><button class="btn gold wide" onclick="saveMock('+qs.length+')">CONCLUIR FULL MOCK INTERVIEW</button></div>'}function saveMockDraft(){document.querySelectorAll('[id^=mq]').forEach(e=>st.mock[e.id.slice(2)]=e.value);st.mock.completed=false;save()}function saveMock(n){saveMockDraft();if(!Array.from({length:n},(_,i)=>st.mock[i]?.trim()).every(Boolean)){$('mockStatus').textContent='Responda a todas as perguntas antes de concluir. Seu rascunho está salvo.';return;}st.mock.completed=true;st.mock.questionCount=n;save();showDashboard()}function actionPlan(){$('view').innerHTML='<div class="card"><div class="ey">ETAPA 10</div><h2>Personal Interview Action Plan</h2><label><b>3 respostas que quero melhorar</b><textarea id="a1">'+esc(st.action.answers||'')+'</textarea></label><label><b>2 objetivos de linguagem</b><textarea id="a2">'+esc(st.action.language||'')+'</textarea></label><label><b>Próxima ação concreta</b><textarea id="a3">'+esc(st.action.next||'')+'</textarea></label><button class="btn wide" onclick="saveAction()">SALVAR ACTION PLAN</button></div>'}function saveAction(){st.action={answers:$('a1').value,language:$('a2').value,next:$('a3').value,completed:true};save();showDashboard()}</script><script src="interview-path.js"></script><script src="interview-recovery.js?v=2"></script><script src="experience.js?v=2"></script></body></html>
