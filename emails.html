<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00162c"><title>ISM Premium — Professional Writing</title><style>:root{--n:#062B3B;--d:#031D29;--t:#22D5D5;--s:#DDF8F7;--b:#F4F7F8;--x:#102A35;--m:#60747C;--bd:#DDE7EA;--ok:#2BAE83;--gold:#E9A83A}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--x);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:36px}.top{background:linear-gradient(135deg,var(--d),var(--n));color:#fff;padding:15px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:4}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--t);color:var(--d);display:grid;place-items:center;font-weight:900}.brand small{display:block;opacity:.8}.main{padding:15px}.card,.hero{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#fff,#f0fbfb)}h2,h3,p{margin-top:0}.ey{font-size:10px;font-weight:900;letter-spacing:.1em;color:#527b83;text-transform:uppercase}.muted{color:var(--m);line-height:1.5}.badge{display:inline-block;background:#fff1c9;color:#795400;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.btn,.choice,.lesson{border:0;border-radius:13px;min-height:48px;padding:12px 15px;font-weight:800;cursor:pointer}.btn{background:var(--n);color:#fff}.btn.soft{background:var(--s);color:var(--n)}.wide{width:100%}.lesson{display:flex;width:100%;gap:11px;align-items:center;text-align:left;background:#fff;border:1px solid var(--bd);margin:7px 0}.lesson.done{border-color:var(--ok);background:#f2fbf7}.num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--s);display:grid;place-items:center}.lesson.done .num{background:var(--ok);color:white}.bar{height:8px;background:#e8eff1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.phrase{padding:12px 0;border-top:1px solid var(--bd)}.en{font-weight:800}.pt{font-size:12px;color:var(--m);margin:4px 0}.audio{border:0;background:var(--s);border-radius:9px;padding:8px 10px;margin:4px 3px 0 0;font-weight:800}.choice{width:100%;text-align:left;background:#fff;color:var(--x);border:1px solid var(--bd);margin:5px 0}.choice.ok{border-color:var(--ok);background:#effbf7}.choice.bad{border-color:#c45b5b;background:#fff3f3}textarea,input{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:125px}.builder{display:grid;gap:9px}.preview{white-space:pre-wrap;background:#f7fafb;border:1px solid var(--bd);border-radius:14px;padding:13px}.sticky{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:20}:focus-visible{outline:3px solid #ad7000;outline-offset:3px}</style><link rel="stylesheet" href="brand-theme.css?v=1"><link rel="stylesheet" href="audio-player.css?v=1"><link rel="stylesheet" href="layout.css?v=2"></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">ISM</div><div><b>Premium Professional Writing</b><small>Global Career Pack</small></div></div></header><main class="main"><div class="sticky"><button class="btn soft" onclick="location.href='index.html#premium'">← PREMIUM</button><button class="btn soft" onclick="dashboard()">⌂ TRILHA</button></div><section id="view"><div class="card">Carregando…</div></section></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="audio-player.js?v=1"></script><script>const API='https://bfuoykappwybuxdlrbmo.supabase.co/functions/v1/ism-premium-content?module=P2',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let course=null,active=null,st={};try{st=JSON.parse(localStorage.getItem('ismbe:premium:p2:v1')||'{}')}catch(e){}st={...st,done:st.done||{},practice:st.practice||{},drafts:st.drafts||{},builder:st.builder||{}};function save(){localStorage.setItem('ismbe:premium:p2:v1',JSON.stringify(st))}function speak(t,r=.95){window.ISMAudio.speak(t,r)}function completed(){return Object.values(st.done).filter(Boolean).length}function progress(){return Math.round(completed()/8*100)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}async function init(){try{const r=await fetch(API),j=await r.json();if(!r.ok||!j.ok||!j.data)throw Error();course=j.data;dashboard()}catch(e){$('view').innerHTML='<div class="card"><h3>Não foi possível carregar esta trilha.</h3><p class="muted">Seu progresso salvo permanece neste navegador.</p><button class="btn" onclick="init()">TENTAR NOVAMENTE</button></div>'}}function dashboard(){if(!course)return init();const p=progress();$('view').innerHTML='<div class="hero"><span class="badge">👑 PREMIUM BONUS 02</span><h2 style="margin-top:10px">'+esc(course.title)+'</h2><p class="muted">'+esc(course.goal)+'</p><div class="bar"><i style="width:'+p+'%"></i></div><p><b>'+completed()+'/8 lições • '+p+'%</b></p></div>'+(p===100?'<div class="card"><h3>🏆 '+esc(course.achievement)+'</h3><p class="muted">Você concluiu a trilha de escrita profissional.</p></div>':'')+'<div class="card"><div class="ey">LIÇÕES</div>'+course.lessons.map((l,i)=>'<button class="lesson '+(st.done[l.id]?'done':'')+'" onclick="openLesson('+i+')"><span class="num">'+(st.done[l.id]?'✓':i+1)+'</span><span><b>'+esc(l.title)+'</b><small class="muted">'+esc(l.pt)+' • '+l.minutes+' min</small></span></button>').join('')+'</div><div class="card"><div class="ey">WRITING TOOL</div><h3>Professional Email Builder</h3><p class="muted">Monte uma mensagem clara com contexto, ação e prazo.</p><button class="btn wide" onclick="emailBuilder()">ABRIR EMAIL BUILDER</button></div>';window.scrollTo(0,0)}function openLesson(i){const l=course.lessons[i];active={i,id:l.id,correct:!!st.practice[l.id]};$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">LESSON '+esc(l.id)+'</div><h2>'+esc(l.title)+'</h2><p class="muted">'+esc(l.objective)+'</p></div><div class="card"><div class="ey">CONTEXT</div><h3>'+esc(l.context)+'</h3></div><div class="card"><div class="ey">LEARN + LISTEN</div>'+l.learn.map(x=>'<div class="phrase"><div class="en">'+esc(x[0])+'</div><div class="pt">'+esc(x[1])+'</div><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+')">▶ Normal</button><button class="audio" onclick="speak('+esc(JSON.stringify(x[0]))+',.72)">🐢 Slow</button></div>').join('')+'</div><div class="card"><div class="ey">NOTICE</div><p>'+esc(Array.isArray(l.notice)?l.notice.join(' '):l.notice)+'</p></div><div class="card"><div class="ey">PRACTICE</div><h3>'+esc(l.practice.prompt)+'</h3>'+l.practice.options.map((o,j)=>'<button class="choice" onclick="grade(this,'+(j===l.practice.answer)+')">'+esc(o)+'</button>').join('')+'<p id="pf" class="muted">'+(st.practice[l.id]?'✓ Atividade concluída.':'Escolha a melhor resposta.')+'</p></div><div class="card"><div class="ey">WRITE • TRANSFER TO WORK</div><h3>'+esc(l.speak)+'</h3><p class="muted">Escreva com sua própria realidade profissional. Não copie o modelo palavra por palavra.</p><textarea id="draft" oninput="saveDraft()" placeholder="Escreva em inglês…">'+esc(st.drafts[l.id]||'')+'</textarea><p id="status" class="muted">Mínimo recomendado: 20 caracteres.</p><button class="btn wide" onclick="finishLesson()">CONCLUIR LIÇÃO</button></div>';window.scrollTo(0,0)}function grade(el,ok){el.closest('.card').querySelectorAll('.choice').forEach(b=>b.disabled=true);el.classList.add(ok?'ok':'bad');if(ok){st.practice[active.id]=true;active.correct=true;save()}$('pf').textContent=(ok?'✓ Correto. ':'Revise e tente novamente. ')+(course.lessons[active.i].practice.feedback||'')}function saveDraft(){st.drafts[active.id]=$('draft').value;save();$('status').textContent='Rascunho salvo neste navegador.'}function finishLesson(){saveDraft();if(!st.practice[active.id])return toast('Conclua corretamente a atividade de Practice.');if(String(st.drafts[active.id]||'').trim().length<20)return toast('Escreva uma resposta um pouco mais completa antes de concluir.');st.done[active.id]=true;save();const next=active.i+1;if(next<course.lessons.length)openLesson(next);else dashboard()}function emailBuilder(){const b=st.builder;$('view').innerHTML='<button class="btn soft" onclick="dashboard()">← TRILHA</button><div class="card"><div class="ey">PROFESSIONAL EMAIL BUILDER</div><h2>Monte seu e-mail</h2><div class="builder"><label><b>Purpose</b><input id="e1" value="'+esc(b.purpose||'I’m writing to…')+'"></label><label><b>Context / update</b><textarea id="e2">'+esc(b.context||'')+'</textarea></label><label><b>Request / action</b><textarea id="e3">'+esc(b.action||'Could you please…?')+'</textarea></label><label><b>Deadline / timing</b><input id="e4" value="'+esc(b.deadline||'by Friday')+'"></label><label><b>Close</b><input id="e5" value="'+esc(b.close||'Please let me know if you have any questions.')+'"></label></div><button class="btn wide" onclick="buildEmail()">GERAR E-MAIL</button><div id="emailPreview"></div></div>'}function buildEmail(){st.builder={purpose:$('e1').value,context:$('e2').value,action:$('e3').value,deadline:$('e4').value,close:$('e5').value};save();const text=[st.builder.purpose,st.builder.context,st.builder.action+(st.builder.deadline?' '+st.builder.deadline+'.':''),st.builder.close].filter(Boolean).join('\n\n');$('emailPreview').innerHTML='<div class="preview">'+esc(text)+'</div><button class="btn soft" onclick="copyEmail()">⧉ COPIAR</button><button class="btn soft" onclick="speak('+esc(JSON.stringify(text))+')">▶ OUVIR</button>'}async function copyEmail(){const text=[st.builder.purpose,st.builder.context,st.builder.action+(st.builder.deadline?' '+st.builder.deadline+'.':''),st.builder.close].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(text);toast('E-mail copiado.')}catch(e){toast('Não foi possível copiar automaticamente.')}}init();</script></body></html>
