name: ISM Staging CI

on:
  pull_request:
    branches: ["github-pages-preview", "ux-learning-upgrade"]
  workflow_dispatch:

jobs:
  qa:
    name: Learning UX QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Build and verify Vercel static artifact
        run: node scripts/build-static.mjs
      - name: JavaScript syntax
        run: |
          set -e
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Learning UX functional contracts
        run: node scripts/published-functional-check.mjs
      - name: Persistence and resume contracts
        run: node scripts/persistence-resume-check.mjs
      - name: Release journey gate
        run: node scripts/release-e2e-contract.mjs
      - name: Product completion gate
        run: node scripts/product-completion-check.mjs
      - name: Market benchmark adaptation gate
        run: node scripts/market-benchmark-check.mjs
      - name: Visual learning gate
        run: node scripts/visual-learning-check.mjs
      - name: Premium learning schema regression
        run: node .ci/premium-check.cjs
      - name: Authentic listening regression
        run: node .ci/authentic-listening-check.cjs
      - name: Regional audio regression
        run: node .ci/regional-audio-check.cjs
      - name: Local asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Upgrade modules present
        run: |
          set -e
          for f in adaptive-coach.js adaptive-coach.css speaking-experience.js speaking-experience.css my-business-english.js my-business-english.css real-business.js real-business.css premium-ux.css completion-hardening.js completion-hardening.css learner-features.js experience.js storage-guard.js audio-player.js visual-learning.js visual-learning.css DEVICE-MEDIA-CERTIFICATION.md FINAL-PROMPT-AUDIT.md MARKET-BENCHMARK-IMPROVEMENT-PROMPT.md; do test -s "$f"; done
          grep -q 'adaptive-coach.js?v=2' experience.js
          grep -q 'completion-hardening.js?v=1' experience.js
          grep -q 'visual-learning.js?v=1' experience.js
          grep -q 'SMART REVIEW 2.0' learner-features.js
          grep -q 'speakingEvidence' speaking-experience.js
          grep -q 'window.ISMMyEnglish' my-business-english.js
          grep -q 'window.ISMRealBusiness' real-business.js
          grep -q 'prefers-reduced-motion' completion-hardening.css
          grep -Eq "const CACHE='ism-business-v[0-9]+'" sw.js
          echo 'upgrade modules ok'
