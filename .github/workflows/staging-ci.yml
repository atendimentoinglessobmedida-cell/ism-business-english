name: ISM static recovery QA
on:
  pull_request:
  push:
    branches: [feature/ism-comercial-pix-manual]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa-static.mjs
