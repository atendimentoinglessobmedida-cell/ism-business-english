name: ISM Staging CI

on:
  pull_request:
    branches: ["github-pages-preview"]
  workflow_dispatch:

jobs:
  qa:
    name: Learning UX QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: JavaScript syntax
        run: |
          set -e
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Learning UX functional contracts
        run: node scripts/published-functional-check.mjs
      - name: Persistence and resume contracts
        run: node scripts/persistence-resume-check.mjs
      - name: Local asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Upgrade modules present
        run: |
          set -e
          for f in adaptive-coach.js adaptive-coach.css speaking-experience.js speaking-experience.css my-business-english.js my-business-english.css real-business.js real-business.css premium-ux.css learner-features.js experience.js storage-guard.js audio-player.js; do test -s "$f"; done
          grep -q 'adaptive-coach.js?v=2' experience.js
          grep -q 'SMART REVIEW 2.0' learner-features.js
          grep -q 'speakingEvidence' speaking-experience.js
          grep -q 'window.ISMMyEnglish' my-business-english.js
          grep -q 'window.ISMRealBusiness' real-business.js
          grep -q 'prefers-reduced-motion' premium-ux.css
          echo 'upgrade modules ok'
