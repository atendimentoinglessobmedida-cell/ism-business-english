name: Deploy ISM Business English to GitHub Pages

on:
  push:
    branches: ["github-pages-preview"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    name: Published App QA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
      - name: Check published functional contracts
        run: node scripts/published-functional-check.mjs
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Validate critical published files
        run: |
          test -s index.html
          test -s scripts/published-functional-check.mjs
          test -s planos.html
          test -s planos.css
          test -s planos.js
          grep -q "CONFIRMAR DISPONIBILIDADE" planos.html
          grep -q "MELHOR VALOR NO CORE" planos.html
          grep -q "R$ 409,99" planos.html
          grep -q "180:40999" planos.js
          grep -q "CONVERSAR PELO WHATSAPP" professor.html
          grep -q "ASSINE JÁ" index.html
          grep -q "FALE POR WHATSAPP" index.html
          grep -q "CONHEÇA O PROFESSOR" index.html
          grep -q "Conversion footer" layout.css
          if grep -q "mailto:" professor.html; then echo "Professor page must use WhatsApp contact"; exit 1; fi
          grep -q "teacher-cover-wrap" professor.html
          grep -q "Vertical-scroll release" layout.css
          grep -q "object-fit:contain!important" layout.css
          grep -q "AO FINAL, VOCÊ SERÁ CAPAZ DE" index.html
          grep -q "function lessonStageNav" index.html
          grep -q "ETAPA " index.html
          grep -q "Core Flow v2" experience.css
          grep -q "screen-context" experience.css
          grep -q "buildReviewExercises" index.html
          grep -q "screen-revise" index.html
          grep -q "Core Review v1" experience.css
          grep -q "SMART REVIEW" index.html
          grep -q "BUSINESS MODE" index.html
          grep -q "learnerSupport" index.html
          grep -q "Travel-inspired learner utilities" experience.css
          test -f core-shell.css
          test -f learner-features.js
          grep -q "storage-guard.js?v=6" index.html
          grep -q "reviewHistory" index.html
          grep -q "reviewPriority" learner-features.js
          grep -q "reviewDue" learner-features.js
          grep -q "pagehide" index.html
          grep -q "ism-business-v50" sw.js
          grep -q "rateReview" learner-features.js
          grep -q "Learning Engine v2" experience.css
          grep -q "home-action-grid" index.html
          grep -q "lesson-stage-compact" index.html
          grep -q "UX Package 3" experience.css
          grep -q "Preciso negociar um prazo" learner-features.js
          grep -q "learner-features.js?v=4" index.html
          grep -q "Pedagogy v2" experience.css
          test -s storage-guard.js
          test -s experience.js
          test -s audio-player.js
          test -s sw.js
          grep -q "ism-business-backup-v1" storage-guard.js
          grep -q "github-pages-preview" .github/workflows/pages.yml
          grep -q "function applyRoute" index.html
          grep -q "history.pushState" index.html
          grep -q "detail:'m'" index.html
          test -s shared-learning-ui.css
          test -s learning-quality.js
          grep -q "learning-rubric" premium-study.js
          grep -q "Autoavaliação oral" index.html
          grep -q "Modo offline" learning-quality.js
          grep -q "scrollIntoView" index.html
          grep -q "Production safe-area correction" layout.css
          grep -q "Release-quality learning feedback" experience.css
          grep -q "function renderSkills" index.html
          grep -q "não representam uma certificação de proficiência" index.html
          grep -q "Skill progress: evidence" experience.css
          test -s premium-shell.css
          grep -q "function capability" audio-player.js
          grep -q "não é uma nota de pronúncia" index.html
          test -s premium-shell.js
          for f in premium.html interview.html emails.html networking.html global-teams.html negotiation.html difficult-conversations.html leadership.html career-growth.html; do grep -q "premium-shell.css" "$f"; grep -q "premium-shell.js" "$f"; done
          for f in interview.html emails.html networking.html global-teams.html negotiation.html difficult-conversations.html leadership.html career-growth.html premium.html practice-more.html; do grep -q "shared-learning-ui.css" "$f"; done

  deploy:
    name: Deploy
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
