name: Deploy ISM Business English to GitHub Pages

on:
  push:
    branches: ["github-pages-preview"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    name: Published App QA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
      - name: Check published functional contracts
        run: node scripts/published-functional-check.mjs
      - name: Check resume and persistence contracts
        run: node scripts/core-resume-contract-check.mjs
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Validate critical release files
        run: |
          set -e
          for f in index.html storage-guard.js learner-features.js core-shell.css experience.js audio-player.js sw.js planos.html planos.css planos.js professor.html premium.html premium-study.js premium-shell.css premium-shell.js shared-learning-ui.css learning-quality.js; do test -s "$f"; done
          grep -q 'onclick="continueLearning()"' index.html
          grep -q 'onclick="nav(this)"' index.html
          grep -q 'SMART REVIEW' index.html
          grep -q 'BUSINESS MODE' index.html
          grep -q 'storage-guard.js?v=13' index.html
          grep -q 'ism-business-v60' sw.js
          grep -q 'indexedDB.open' storage-guard.js
          grep -q 'ism-business-backup-v1' storage-guard.js
          grep -q 'R$ 409,99' planos.html
          grep -q '180:40999' planos.js
          grep -q 'FALE POR WHATSAPP' index.html
          grep -q 'CONHEÇA O PROFESSOR' index.html
          if grep -q 'mailto:' professor.html; then echo 'Professor page must use WhatsApp contact'; exit 1; fi
          for f in premium.html interview.html emails.html networking.html global-teams.html negotiation.html difficult-conversations.html leadership.html career-growth.html; do grep -q 'premium-shell.css' "$f"; grep -q 'premium-shell.js' "$f"; done
          echo 'critical release files ok'

  deploy:
    name: Deploy
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
