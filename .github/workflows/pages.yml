name: Deploy ISM Business English to GitHub Pages

on:
  push:
    branches: ["github-pages-preview"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    name: Published App QA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Validate critical published files
        run: |
          test -s index.html
          test -s storage-guard.js
          test -s experience.js
          test -s audio-player.js
          test -s sw.js
          grep -q "ism-business-backup-v1" storage-guard.js
          grep -q "github-pages-preview" .github/workflows/pages.yml
          grep -q "function applyRoute" index.html
          grep -q "history.pushState" index.html
          grep -q "detail:'m'" index.html
          test -s shared-learning-ui.css
          test -s learning-quality.js
          grep -q "learning-rubric" premium-study.js
          grep -q "Autoavaliação oral" index.html
          grep -q "Modo offline" learning-quality.js
          grep -q "scrollIntoView" index.html
          grep -q "Production safe-area correction" layout.css
          grep -q "Release-quality learning feedback" experience.css
          grep -q "function updateToday" index.html
          grep -q 'class="today-card"' index.html
          grep -q "UX round 2: Home centers" experience.css
          grep -q "function renderSkills" index.html
          grep -q "não representam uma certificação de proficiência" index.html
          grep -q "Skill progress: evidence" experience.css
          for f in interview.html emails.html networking.html global-teams.html negotiation.html difficult-conversations.html leadership.html career-growth.html premium.html practice-more.html; do grep -q "shared-learning-ui.css" "$f"; done

  deploy:
    name: Deploy
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
