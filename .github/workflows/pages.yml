name: Deploy ISM Business English to GitHub Pages

on:
  push:
    branches: ["github-pages-preview", "ux-learning-upgrade"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  qa:
    name: Published App QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Check published functional contracts
        run: node scripts/published-functional-check.mjs
      - name: Check Core resume contracts
        run: node scripts/core-resume-contract-check.mjs
      - name: Check learning upgrade persistence contracts
        run: node scripts/persistence-resume-check.mjs
      - name: Check release journey gate
        run: node scripts/release-e2e-contract.mjs
      - name: Check product completion gate
        run: node scripts/product-completion-check.mjs
      - name: Check market benchmark gate
        run: node scripts/market-benchmark-check.mjs
      - name: Check visual learning gate
        run: node scripts/visual-learning-check.mjs
      - name: Check Premium learning schema
        run: node .ci/premium-check.cjs
      - name: Check authentic listening
        run: node .ci/authentic-listening-check.cjs
      - name: Check regional audio
        run: node .ci/regional-audio-check.cjs
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)=["\']([^"\'#?]+)', text):
                  if ref.startswith(('http://','https://','mailto:','tel:')): continue
                  target=(p.parent/ref).resolve()
                  if not target.exists(): missing.append(f'{p}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('local references ok')
          PY
      - name: Validate critical release files
        run: |
          set -e
          for f in index.html storage-guard.js learner-features.js core-shell.css experience.js audio-player.js sw.js adaptive-coach.js adaptive-coach.css speaking-experience.js speaking-experience.css my-business-english.js my-business-english.css real-business.js real-business.css premium-ux.css completion-hardening.js completion-hardening.css visual-learning.js visual-learning.css action-buttons.css DEVICE-MEDIA-CERTIFICATION.md FINAL-PROMPT-AUDIT.md planos.html planos.css planos.js professor.html premium.html premium-study.js premium-shell.css premium-shell.js shared-learning-ui.css learning-quality.js; do test -s "$f"; done
          grep -q 'onclick="continueLearning()"' index.html
          grep -q 'onclick="nav(this)"' index.html
          grep -q 'SMART REVIEW' index.html
          grep -q 'BUSINESS MODE' index.html
          grep -q 'storage-guard.js?v=13' index.html
          grep -Eq "const CACHE='ism-business-v[0-9]+'" sw.js
          grep -q 'completion-hardening.js' sw.js
          grep -q 'visual-learning.js' sw.js
          grep -q 'action-buttons.css' sw.js
          grep -q 'completion-hardening.js?v=1' experience.js
          grep -q 'visual-learning.js?v=1' experience.js
          grep -q 'action-buttons.css?v=1' experience.js
          grep -q 'indexedDB.open' storage-guard.js
          grep -q 'ism-business-backup-v1' storage-guard.js
          grep -q 'R$ 409,99' planos.html
          grep -q '180:40999' planos.js
          grep -q 'FALE POR WHATSAPP' index.html
          grep -q 'CONHEÇA O PROFESSOR' index.html
          if grep -q 'mailto:' professor.html; then echo 'Professor page must use WhatsApp contact'; exit 1; fi
          echo 'critical release files ok'

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/github-pages-preview'
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build public artifact
        run: node scripts/build-static.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
